# On-demand Claude PR review.
#
# Runs ONLY when someone with write access asks for it:
#   - comment "@claude review" on a pull request, or
#   - add the "claude-review" label to a pull request.
# It never runs automatically on open/push.
#
# Claude reviews for security issues, bugs and other fixes, leaves inline
# comments, then submits a formal GitHub review: APPROVE or REQUEST_CHANGES.
#
# Setup:
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Add the repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`).
#      To use an API key instead, add ANTHROPIC_API_KEY and swap the auth line
#      below to `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
#   3. Merge this file to the default branch (comment triggers only read
#      workflows from there).

name: Claude Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review')) ||
      (github.event_name == 'pull_request' &&
        github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

            You are reviewing this pull request. The PR's code is checked out in
            the working directory. Read the diff with `gh pr diff` and the PR
            description with `gh pr view`, and read surrounding code as needed.
            Do not run, build or install anything.

            Sailfish is a browser-in-a-browser that loads sites through a
            Scramjet + Wisp web proxy, served by a Fastify server. Look for:

            1. Security: SSRF and open-proxy abuse (requests to localhost,
               private/link-local IPs, cloud metadata), XSS and unsafe HTML,
               header/cookie leakage between proxied origins, service-worker
               scope issues, path traversal in static serving, unvalidated
               input, secrets committed to the repo, risky new dependencies.
            2. Bugs: logic errors, broken edge cases, race conditions, unhandled
               errors or promise rejections, resource leaks (sockets, streams),
               incorrect types, React hook misuse.
            3. Other fixes worth making: missing tests for changed behavior,
               dead code, clear simplifications. Skip pure style nits that
               Prettier/ESLint would catch.

            Only report issues you have verified against the code. For each
            one, post an inline comment on the exact line with
            mcp__github_inline_comment__create_inline_comment, saying what is
            wrong, why it matters, and a concrete fix (use a ```suggestion
            block when it is a small change).

            Then submit exactly one formal review with `gh pr review`:
            - If you found any security issue or bug: `--request-changes`
            - Otherwise (no findings, or only minor optional suggestions): `--approve`
            The review body is a short summary: what the PR does, findings
            grouped as Security / Bugs / Other with severity, and the verdict.
            If GitHub refuses to approve or request changes (for example on
            your own PR), submit the same body with `--comment` instead.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Read,Glob,Grep"
